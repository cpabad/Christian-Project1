<!DOCTYPE html>
<html lang="en" data-theme="light">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Expense Reimbursement System</title>

        <!-- Pico.css: classless base styling -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

        <style>
            /* Deep-teal accent (finance/approval), overriding Pico's default blue */
            :root {
                --pico-primary: #0f766e;
                --pico-primary-background: #0f766e;
                --pico-primary-hover: #0b5f58;
                --pico-primary-hover-background: #0b5f58;
                --pico-primary-focus: rgba(15, 118, 110, 0.3);
                --pico-primary-underline: rgba(15, 118, 110, 0.5);
            }
            h1 {
                font-family: "Space Grotesk", var(--pico-font-family-sans-serif);
                letter-spacing: -0.02em;
                margin-bottom: 0.25rem;
            }
            body { display: grid; place-items: center; min-height: 100vh; }
            .login-card { width: 100%; max-width: 26rem; }
        </style>
    </head>

    <body>
        <main class="container">
            <article class="login-card">
                <hgroup>
                    <h1>Expense Reimbursement</h1>
                    <p>Sign in to submit and track your reimbursement requests.</p>
                </hgroup>
                <div id="login-div">
                    <input placeholder="Email or username" id="username" autocomplete="username" required />
                    <input placeholder="Password" type="password" id="password" autocomplete="current-password" required />
                    <button id="loginButton">Login</button>
                </div>
            </article>
        </main>
        <script>
                // One login for both roles: the server authenticates and answers with the
                // user's role; the role - not the button the user happened to click - decides
                // which homepage to open. (Authorization on /manager/ URLs is enforced
                // server-side by the filters either way; this routing is navigation, not access
                // control.)
                function login() {
                    let xhr = new XMLHttpRequest()
                    let loginUsername = document.getElementById('username').value
                    let loginPassword = document.getElementById('password').value
                    xhr.onreadystatechange = function () {
                        if (xhr.readyState !== 4) return
                        // FrontController JSON-serializes the returned string, so the body
                        // arrives quoted ('"Supervisor"') - parse it, never compare raw text.
                        let message = xhr.responseText ? JSON.parse(xhr.responseText) : 'Invalid Credentials'
                        if (xhr.status === 200) {
                            window.open(message === 'Supervisor'
                                ? '/ReimbursementManagement/supervisorhomepage.html'
                                : '/ReimbursementManagement/employeehomepage.html', '_self')
                        } else {
                            window.alert(message)
                        }
                    }
                    xhr.open('POST', '/ReimbursementManagement/app/login')
                    // Credentials travel in the POST body, never the query string: URLs (query
                    // string included) are written to Tomcat access logs and any proxy logs.
                    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded')
                    xhr.send('username=' + encodeURIComponent(loginUsername)
                           + '&password=' + encodeURIComponent(loginPassword))
                }
                document.getElementById('loginButton').addEventListener('click', login)
        </script>
    </body>

</html>
